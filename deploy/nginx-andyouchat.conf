# AndYouChat 站点配置（宝塔：网站 → 设置 → 配置文件，整段替换）
#
# 架构：Nginx 直接托管前端静态文件（/chat/），/api/ 与 /ws 反向代理给本机 FastAPI。
#
# 替换点：
#   1. chat.example.com            → 你的域名（三处）
#   2. /www/server/chat_server     → 实际部署目录（两处 root，指向 chat 目录的上一级）
#      如果你的 chat 目录不在项目里、而是直接在宝塔站点根下（站点根通常是
#      /www/wwwroot/你的域名），把这两行 root 删掉即可，location 会继承 server 级 root。
#   3. 证书路径以宝塔「SSL」页实际生成的为准
#
# 关键点：
#   - 前端必须用 `npm run build:chat` 构建（资源前缀为 /chat/），用普通 build 会 404
#   - /chat/ 用 root 而不是 alias，alias 和 try_files 组合会拼成双重路径
#   - /ws 必须单独配 Upgrade/Connection 头，read_timeout 放大（前端 25s 心跳）
#   - /ws 的 location 必须在 / 之前
#   - /api/ 走 proxy_pass 不带尾斜杠，才能保留 /api/v1/... 原始路径
#   - 后端端口只在这个 upstream 里写一次，以后改端口只改这一行

# 后端地址（FastAPI 只监听本机）
upstream andyouchat_backend {
    server 127.0.0.1:8200;
}

server {
    listen 80;
    listen [::]:80;
    server_name chat.example.com;

    # 证书申请期间保持可访问；开启「强制 HTTPS」后宝塔会自动加跳转规则
    return 301 https://$host$request_uri;
}

server {
    # 宝塔自带 nginx 版本可能是 1.24，因此用 listen ... http2 的老写法（1.25+ 会提示 deprecated，但仍可用）
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name chat.example.com;

    # ---- 证书（宝塔 Let's Encrypt 生成路径） ----
    ssl_certificate     /www/server/panel/vhost/cert/chat.example.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/chat.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # ---- 基础 ----
    charset utf-8;
    client_max_body_size 20m;
    access_log /www/wwwlogs/andyouchat.access.log;
    error_log  /www/wwwlogs/andyouchat.error.log;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ---- 压缩（宝塔全局一般已开，这里显式声明，避免被站点配置覆盖） ----
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_vary on;

    # ---- 1. 前端：/chat/ ----
    # 注意 `^~`：宝塔默认模板里有 `location ~ .*\.(js|css)?$` 这类正则 location，
    # 正则优先级高于普通前缀匹配，会把 /chat/assets/*.js 抢走导致全站 404。
    # ^~ 表示前缀命中后不再检查正则。若你保留了宝塔那几条正则段，务必删掉。

    # /chat 补齐尾斜杠，否则相对路径会以 / 为基准解析
    location = /chat {
        return 301 /chat/;
    }

    # 带 hash 的构建产物，可长期缓存
    location ^~ /chat/assets/ {
        root /www/server/chat_server;      # 实际目录：/www/server/chat_server/chat/assets/
        expires 365d;
        access_log off;
    }

    # 入口 HTML 不缓存，保证发版后立刻拿到新的 assets 文件名
    location ^~ /chat/ {
        root /www/server/chat_server;      # 实际目录：/www/server/chat_server/chat/
        index index.html;
        try_files $uri $uri/ /chat/index.html;
        expires -1;                        # 等价于 Cache-Control: no-cache
        access_log off;
    }

    # ---- 2. WebSocket ----
    location /ws {
        proxy_pass http://andyouchat_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # ---- 3. 后端接口 ----
    location /api/ {
        proxy_pass http://andyouchat_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_redirect off;
    }

    # ---- 4. 健康检查（排障用，不写访问日志） ----
    location = /health {
        proxy_pass http://andyouchat_backend;
        proxy_set_header Host $host;
        access_log off;
    }

    # ---- 5. 根路径直接进前端 ----
    location = / {
        return 302 /chat/;
    }

    # ---- 6. 其余（/docs、/static/chat.html 调试台等）交给 FastAPI ----
    location / {
        proxy_pass http://andyouchat_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_redirect off;
    }

    # ---- 7. 生产建议：关闭接口文档，只留自己的 IP 可访问 ----
    # 注意：它必须放在 location / 之前才会生效，取消注释后把上面第 6 节拆成两条
    # location ~ ^/(docs|redoc|openapi\.json)$ {
    #     allow 203.0.113.10;   # 你的办公/家庭固定 IP
    #     deny all;
    #     proxy_pass http://andyouchat_backend;
    #     proxy_set_header Host $host;
    # }
}
