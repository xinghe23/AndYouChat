# ============================================================================
# AndYouChat 追加到「已有站点」配置里的最小片段（零拷贝版）
#
# 场景：站点根路径的 /api/ 已被别的后端占用（例如 127.0.0.1:8101），
#       聊天应用挂在子目录 /chat/，接口走自己的 /chat/api 前缀，互不影响。
#
# 用法：整段粘进站点 server { } 里，放在任意位置（4 条都是 ^~ 或 = 精确匹配，
#       优先级高于文件末尾的 `location ~ .*\.(js|css)?$` 正则）。
#       不要修改原有的 location /api/ { ... }，那是别的后端在用。
#
# 前提：
#   1. 前端产物已在 /www/server/chat_server/chat/（部署包自带）
#   2. 后端在 127.0.0.1:8200 运行（curl -s http://127.0.0.1:8200/health）
#   3. 前端构建时 VITE_API_BASE=/chat（web/.env.chat 已配置，只到 /chat）
# ============================================================================

    # 1) 补斜杠：/chat → /chat/
    location = /chat {
        return 301 /chat/;
    }

    # 2) 接口：/chat/api/xxx → 8200 的 /api/xxx
    #    proxy_pass 末尾带 /api/ 是「替换前缀」语义，会剥掉 /chat。
    #    必须用 ^~，否则会被 js|css 正则截走。
    location ^~ /chat/api/ {
        proxy_pass http://127.0.0.1:8200/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # 3) WebSocket：/chat/ws → 8200 的 /ws
    #    精确匹配，避免被下面 /chat/ 的 try_files 吃掉；超时给足否则空闲被掐。
    location = /chat/ws {
        proxy_pass http://127.0.0.1:8200/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # 4) 前端静态资源：带哈希文件名，可长缓存（内容变则文件名变，天然不冲突）
    location ^~ /chat/assets/ {
        root /www/server/chat_server;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # 5) index.html 绝不缓存：发版后立即生效，不必让用户清缓存
    #    精确匹配优先级最高，会先于下面的 ^~ /chat/ 命中
    location = /chat/index.html {
        root /www/server/chat_server;
        add_header Cache-Control "no-store";
    }

    # 6) 前端 SPA：其余 /chat/* 走 index.html
    #    root 指向项目目录（包内自带 chat/ 子目录），所以不用把文件拷到站点根。
    location ^~ /chat/ {
        root /www/server/chat_server;
        try_files $uri $uri/ /chat/index.html;
        add_header Cache-Control "no-store";
    }
